permissions:
  contents: read

name: PhpUnit tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: 'recursive'
        persist-credentials: false

    - name: Install PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      env:
        update: true
      with:
        php-version: '8.2'
        ini-values: session.upload_progress.enabled=0

    - name: Verify PHP version
      run: |
        php -v
        php -r '
          $v = PHP_VERSION;
          $ok = (version_compare($v, "8.2.35", ">=") && version_compare($v, "8.3.0", "<"))
             || (version_compare($v, "8.3.36", ">=") && version_compare($v, "8.4.0", "<"))
             || (version_compare($v, "8.4.27", ">=") && version_compare($v, "8.5.0", "<"))
             || version_compare($v, "8.5.12", ">=");
          if (!$ok) {
              fwrite(STDERR, "Vulnerable PHP version detected: $v\n");
              exit(1);
          }
          echo "Verified patched PHP version: $v\n";
        '

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-progress --no-suggest;
        composer dump-autoload;

    - name: Run tests
      run: USE_TOOLS_PROTOC=true ./vendor/bin/phpunit
