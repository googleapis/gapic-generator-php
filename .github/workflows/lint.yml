permissions:
  contents: read

name: Lint

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    style:
        name: PHP Style Check
        uses: GoogleCloudPlatform/php-tools/.github/workflows/code-standards.yml@c9ef4db634c55806c0a596e7278ff8ab62e0ca41 # v0.16.1
        with:
          path: src
          exclude-patterns: '["src/Protobuf/Internal"]'

    static-analysis:
        name: PHPStan Static Analysis
        uses: GoogleCloudPlatform/php-tools/.github/workflows/static-analysis.yml@c9ef4db634c55806c0a596e7278ff8ab62e0ca41 # v0.16.1
        with:
          autoload-file: tests/Unit/autoload.php
